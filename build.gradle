plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    maven { url = uri('https://maven.theillusivec4.top'); content { includeGroup 'top.theillusivec4.curios' } }
    maven { url = uri('https://maven.blamejared.com'); content { includeGroup 'mezz.jei' } }
    maven { url = uri('https://api.modrinth.com/maven'); content { includeGroup 'maven.modrinth' } }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
// Verification and audit launchers must not inherit the host application's Java runtime.
tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Directory mods are the single optional-mod source for the debug client.
            if (['withCurios', 'withJade', 'withJei'].any { providers.gradleProperty(it).getOrElse('false').toBoolean() }) {
                throw new GradleException('Debug client uses directory mods; remove withCurios/withJade/withJei runtimeOnly flags')
            }
            gameDirectory = project.file(providers.gradleProperty('ideaWithoutOptionalMods')
                .getOrElse('false').toBoolean() ? 'run/idea-debug-bare-r22' : 'run/compat-r17')

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            gameDirectory = project.file('run/idea-server-r22')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('run/idea-gametest-r22')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            gameDirectory = project.file('run/idea-data-r22')

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }


dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    compileOnly 'top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1'
    if (providers.gradleProperty('withCurios').getOrElse('false').toBoolean()) runtimeOnly 'top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1'
    compileOnly 'mezz.jei:jei-1.21.1-common-api:19.69.0.457'
    compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.69.0.457'
    compileOnly 'maven.modrinth:jade:eYz2YBGT'
    if (providers.gradleProperty('withJei').getOrElse('false').toBoolean()) runtimeOnly('mezz.jei:jei-1.21.1-neoforge:19.69.0.457') { transitive = false }
    if (providers.gradleProperty('withJade').getOrElse('false').toBoolean()) runtimeOnly 'maven.modrinth:jade:eYz2YBGT'
    // Example mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-forge-api:${jei_version}"
    // runtimeOnly "mezz.jei:jei-${mc_version}-forge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

tasks.named('test', Test) {
    useJUnitPlatform()
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// These suites use executable assertions rather than JUnit. Keep them in the same
// check lifecycle so adding a module cannot leave its verification source unrun.
def moduleVerificationClasses = [
    'api.tx.MaterialOwnerKeyTest',
    'data.ElementItemCompositionTest',
    'data.ElementalBlockCompositionTest',
    'data.MaterialBehaviorLibraryTest',
    'fluid.waterbody.WaterBodyModelTest',
    'gametest.machine.DetectorPartTest',
    'gametest.machine.DisplayCodecTest',
    'gametest.machine.MachineStateTest',
    'gametest.machine.MaterialStateBalanceTest',
    'gametest.machine.QueryPolicyTest',
    'gametest.machine.ReactionViewSyncTest',
    'gametest.machine.TransportTopologyTest',
    'reaction.CompetingExtentsTest',
    'reaction.DissolutionInvariantTest',
    'reaction.EnvironmentRegressionTest',
    'reaction.EquilibriumPrecisionTest',
    'reaction.FiniteContainerTest',
    'reaction.MixedPhaseTest',
    'reaction.NuclearInvariantTest',
    'reaction.NuclearTransactionTest',
    'reaction.SimulationInvariantTest',
    'reaction.SorptionDataTest',
    'reaction.SorptionInvariantTest',
    'reaction.SynthesisServiceTest',
    'reaction.WaterLifecycleTransactionTest',
    'thermal.PhaseLibraryTest',
    'world.heat.FiniteHeatEvidenceTest',
    'world.heat.LoadedFiniteHeatResolverTest'
]
def moduleVerificationTasks = moduleVerificationClasses.collect { suite ->
    tasks.register(suite.replace('.', '_') + 'Verify', JavaExec) {
        group = 'verification'
        description = "Run ${suite} executable assertions."
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'org.goldgom.chemicalelements.' + suite
        workingDir = projectDir
    }
}
tasks.register('modulesVerify') {
    group = 'verification'
    description = 'Verify material, thermal, water, reaction and machine modules.'
    dependsOn moduleVerificationTasks
}
tasks.named('check') { dependsOn tasks.named('modulesVerify') }
tasks.register('integrationVerify') {
    group = 'verification'
    description = 'Run all standalone/JUnit checks and the registered NeoForge GameTests.'
    dependsOn tasks.named('check'), 'runGameTestServer'
}

tasks.register('coreVerify', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.goldgom.chemicalelements.core.CoreVerification'
    workingDir = projectDir
}
tasks.register('instanceVerify', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.goldgom.chemicalelements.instance.InstanceVerification'
    workingDir = projectDir
}
tasks.register('machineTransactionsVerify', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.goldgom.chemicalelements.gametest.machine.MachineTransactionsTest'
    workingDir = projectDir
}
tasks.named('check') { dependsOn tasks.named('coreVerify'), tasks.named('instanceVerify'), tasks.named('machineTransactionsVerify') }
tasks.register('vanillaAudit', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.goldgom.chemicalelements.core.VanillaInventoryAudit'
    workingDir = projectDir
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Explicit before-launch entry: no check/build/GameTest/jar prerequisite.
def prepareIdeaClient = tasks.register('prepareIdeaClient') {
    group = 'mod development'
    description = 'Compile current sources/resources and prepare client launch files; no JAR or tests.'
    dependsOn tasks.named('classes'), tasks.named('prepareClientRun')
}
// ModDev regenerates its Client configuration on IDEA sync. Keep its prerequisite too.
// Do not attach this to prepareClientRun itself: that would create a dependency cycle.
neoForge.runs.named('client') {
    taskBefore prepareIdeaClient
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
